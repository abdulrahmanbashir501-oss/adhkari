<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1f6b4f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>أذكاري</title>
<style>
:root{--bg:#f6f1e7;--card:#fffdf8;--ink:#1f2a24;--mute:#6b7a70;--accent:#1f6b4f;--accent2:#d9efe4;--line:#e6dfcf;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a16;--card:#1a251f;--ink:#e9efe9;--mute:#97a79c;--accent:#5fc59a;--accent2:#203a2e;--line:#2a3a31}}
:root[data-theme="dark"]{--bg:#121a16;--card:#1a251f;--ink:#e9efe9;--mute:#97a79c;--accent:#5fc59a;--accent2:#203a2e;--line:#2a3a31}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Naskh Arabic","Amiri",Tahoma,serif;max-width:560px;margin-inline:auto;padding:16px 14px 40px}
h1{font-size:22px;margin:4px 0 2px}
.sub{color:var(--mute);font-size:14px;margin:0 0 14px;font-family:Tahoma,sans-serif}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.tab{flex:1;white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 12px;border-radius:12px;font:inherit;font-size:15px;cursor:pointer}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.bar{height:8px;background:var(--line);border-radius:8px;margin:12px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.stat{font-size:13px;color:var(--mute);font-family:Tahoma,sans-serif;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.card.done{background:var(--accent2);opacity:.75}
.txt{font-size:21px;line-height:2;margin:0 0 8px}
.note{font-size:13px;color:var(--mute);font-family:Tahoma,sans-serif}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.cnt{background:var(--accent);color:#fff;border-radius:999px;min-width:78px;text-align:center;padding:6px 14px;font-family:Tahoma,sans-serif;font-size:15px}
.done .cnt{background:transparent;color:var(--accent);font-size:20px}
.reset{background:none;border:0;color:var(--mute);font:inherit;font-size:13px;margin-top:10px;cursor:pointer;text-decoration:underline}
.dua{text-align:center;color:var(--mute);margin-top:22px;font-size:16px;line-height:1.9}
</style>
</head>
<body>
<h1>🌙 أذكاري</h1>
<p class="sub" id="date"></p>
<div class="tabs" id="tabs"></div>
<div class="bar"><i id="fill"></i></div>
<div class="stat" id="stat"></div>
<div id="list"></div>
<button class="reset" id="reset">إعادة ضبط القسم ده</button>
<p class="dua">«اللَّهُمَّ احْفَظْنِي مِنْ بَيْنِ يَدَيَّ وَمِنْ خَلْفِي»<br>ولو نسيت مرة، كمّل من حيث وقفت.</p>
<script>
const SUB="بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ";
const KURSI="اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَنْ ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ";
const IKH="قُلْ هُوَ اللَّهُ أَحَدٌ ۝ اللَّهُ الصَّمَدُ ۝ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ";
const FAL="قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۝ مِنْ شَرِّ مَا خَلَقَ ۝ وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝ وَمِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ۝ وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ";
const NAS="قُلْ أَعُوذُ بِرَبِّ النَّاسِ ۝ مَلِكِ النَّاسِ ۝ إِلَٰهِ النَّاسِ ۝ مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ۝ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ۝ مِنَ الْجِنَّةِ وَالنَّاسِ";
const ISTI="اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ";
const LAILA="لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ";
const SALAH="اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى نَبِيِّنَا مُحَمَّدٍ";
const RADI="رَضِيتُ بِاللَّهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ صلى الله عليه وسلم نَبِيًّا";
const HASBI="حَسْبِيَ اللَّهُ لَا إِلَهَ إِلَّا هُوَ عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ";
const SUBH="سُبْحَانَ اللَّهِ وَبِحَمْدِهِ";
const DATA={
morning:{name:"☀️ الصباح",items:[
[KURSI,1],[IKH,3],[FAL,3],[NAS,3],
["أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ",1],
["اللَّهُمَّ بِكَ أَصْبَحْنَا، وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ النُّشُورُ",1],
[ISTI+"<div class=note>سيد الاستغفار</div>",1],[RADI,3],[SUB,3],[HASBI,7],
[SUBH,100],[LAILA,10],[SALAH,10],
["أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ",3],
["أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ",100]]},
evening:{name:"🌇 المساء",items:[
[KURSI,1],[IKH,3],[FAL,3],[NAS,3],
["أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ",1],
["اللَّهُمَّ بِكَ أَمْسَيْنَا، وَبِكَ أَصْبَحْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ الْمَصِيرُ",1],
[ISTI+"<div class=note>سيد الاستغفار</div>",1],[RADI,3],[SUB,3],[HASBI,7],
[SUBH,100],[LAILA,10],[SALAH,10],
["أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ",3],
["أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ",100]]},
prayer:{name:"🕌 بعد الصلاة",items:[
["أَسْتَغْفِرُ اللَّهَ",3],
["اللَّهُمَّ أَنْتَ السَّلَامُ، وَمِنْكَ السَّلَامُ، تَبَارَكْتَ يَا ذَا الْجَلَالِ وَالْإِكْرَامِ",1],
["سُبْحَانَ اللَّهِ",33],["الْحَمْدُ لِلَّهِ",33],["اللَّهُ أَكْبَرُ",34],[LAILA,1],[KURSI,1]]},
sleep:{name:"😴 النوم",items:[
[KURSI,1],[IKH+"<div class=note>ثم الفلق ثم الناس، وتُقرأ بعد النفث في الكفين ومسح الجسد</div>",3],[FAL,3],[NAS,3],
["بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا",1],
["اللَّهُمَّ قِنِي عَذَابَكَ يَوْمَ تَبْعَثُ عِبَادَكَ",3],
["سُبْحَانَ اللَّهِ",33],["الْحَمْدُ لِلَّهِ",33],["اللَّهُ أَكْبَرُ",34]]}
};
const $=s=>document.querySelector(s);
const nowDate=new Date(); const today=nowDate.getFullYear()+"-"+String(nowDate.getMonth()+1).padStart(2,"0")+"-"+String(nowDate.getDate()).padStart(2,"0");
let state={};
try{const s=JSON.parse(localStorage.getItem("adhkar")||"{}");if(s.day===today)state=s}catch(e){}
state.day=today;state.c=state.c||{};
let tab=localStorage.getItem("adhkar_tab_"+today);
try{if(!tab||!DATA[tab]){const h=new Date().getHours();tab=h>=4&&h<14?"morning":h>=14&&h<21?"evening":"sleep"}}catch(e){tab="morning"}
function save(){try{localStorage.setItem("adhkar",JSON.stringify(state))}catch(e){}}
function key(i){return tab+i}
function render(){
 const d=DATA[tab];
 $("#tabs").innerHTML=Object.keys(DATA).map(k=>`<button class="tab ${k===tab?"on":""}" data-k="${k}">${DATA[k].name}</button>`).join("");
 let done=0;
 $("#list").innerHTML=d.items.map(([t,n],i)=>{
  const c=state.c[key(i)]||0,fin=c>=n;if(fin)done++;
  return `<div class="card ${fin?"done":""}" data-i="${i}"><p class="txt">${t}</p><div class="row"><span class="note">${n>1?"التكرار: "+n+" مرة":"مرة واحدة"}</span><span class="cnt">${fin?"✓":c+" / "+n}</span></div></div>`}).join("");
 const p=Math.round(done/d.items.length*100);
 $("#fill").style.width=p+"%";
 $("#stat").textContent=done===d.items.length?"ما شاء الله، خلصت القسم ده 🤍":"خلّصت "+done+" من "+d.items.length+" ("+p+"%)";
}
$("#tabs").onclick=e=>{const b=e.target.closest(".tab");if(!b)return;tab=b.dataset.k;try{localStorage.setItem("adhkar_tab_"+today,tab)}catch(x){}render()};
$("#list").onclick=e=>{const c=e.target.closest(".card");if(!c)return;const i=+c.dataset.i,n=DATA[tab].items[i][1],k=key(i);
 if((state.c[k]||0)<n){state.c[k]=(state.c[k]||0)+1;if(navigator.vibrate)navigator.vibrate(15);save();render()}};
$("#reset").onclick=()=>{DATA[tab].items.forEach((_,i)=>delete state.c[key(i)]);save();render()};
$("#date").textContent=new Date().toLocaleDateString("ar-EG",{weekday:"long",day:"numeric",month:"long"});
render();
</script>
</body>
</html>
